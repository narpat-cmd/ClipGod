services:
  - type: web
    name: clipgod-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clipgod-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: WHISPER_MODEL
        value: "base"

  - type: web
    name: clipgod-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        fromService:
          name: clipgod-backend
          type: web
          property: hostport

databases:
  - name: clipgod-db
    databaseName: clipgod
    user: clipgod